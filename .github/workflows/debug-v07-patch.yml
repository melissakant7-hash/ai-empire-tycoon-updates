name: Diagnose City Bank v0.7 Patch

on:
  push:
    branches:
      - city-bank-tycoon-build
    paths:
      - ".github/workflows/debug-v07-patch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact stored v0.7 patch
        run: |
          cat city-bank-v07-patch/part*.patch > actual-v07.patch
          sha256sum city-bank-v07-patch/part*.patch actual-v07.patch
          wc -c city-bank-v07-patch/part*.patch actual-v07.patch
      - name: Upload exact stored patch
        uses: actions/upload-artifact@v4
        with:
          name: actual-v07-patch
          path: actual-v07.patch
          retention-days: 1
