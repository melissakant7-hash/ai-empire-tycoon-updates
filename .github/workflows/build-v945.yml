name: Build and publish AI Empire Tycoon v9.4.5

on:
  pull_request:
    paths:
      - 'build/v9.4.5/**'
      - '.github/workflows/build-v945.yml'
  push:
    branches: [main]
    paths:
      - 'build/v9.4.5/**'
      - '.github/workflows/build-v945.yml'

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v9.4.4 base
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.4/part*.txt > /tmp/v944.b64
          base64 -d /tmp/v944.b64 > /tmp/v944.html.gz
          gzip -dc /tmp/v944.html.gz > /tmp/old
          echo '70a3376f101e211dc65b05db0115497de7ff94e8ae1d551cff75dc04797423c7  /tmp/old' | sha256sum -c -

      - name: Apply v9.4.5 social consequences and usage-cost patch
        shell: bash
        run: |
          set -euo pipefail
          cat build/v9.4.5/patch*.txt > /tmp/v945.patch.b64
          base64 -d /tmp/v945.patch.b64 > /tmp/v945.patch.gz
          gzip -dc /tmp/v945.patch.gz > /tmp/v945.patch
          cd /tmp
          patch old < v945.patch
          echo '026b7a9162e86b12f74d82979fac90f733a9f681bcd76e5bba4c2f08b4192ac8  /tmp/old' | sha256sum -c -

      - name: Verify v9.4.5 gameplay hooks and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AI Empire Tycoon v9.4.5' /tmp/old
          grep -q 'Inference &amp; Usage' /tmp/old
          grep -q 'modelInferenceCostV945' /tmp/old
          grep -q 'analysePlayerSocialPostV945' /tmp/old
          grep -q 'applyPlayerSocialImpactV945' /tmp/old
          grep -q 'Company impact' /tmp/old
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/old').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/v945.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v945.js

      - name: Package v9.4.5 and update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/v9.4.5
          mkdir -p packages/v9.4.5
          gzip -n -9 -c /tmp/old > /tmp/v945.html.gz
          base64 -w0 /tmp/v945.html.gz > /tmp/v945.b64
          split -b 10000 -d -a 2 --additional-suffix=.txt /tmp/v945.b64 packages/v9.4.5/part
          python3 - <<'PY'
          from pathlib import Path
          import json
          parts=sorted(Path('packages/v9.4.5').glob('part*.txt'))
          base='https://raw.githubusercontent.com/melissakant7-hash/ai-empire-tycoon-updates/main/'
          sha='026b7a9162e86b12f74d82979fac90f733a9f681bcd76e5bba4c2f08b4192ac8'
          manifest={
              'latestVersion':'9.4.5',
              'required':False,
              'autoUpdate':True,
              'message':'v9.4.5 makes player-authored social posts affect reputation, brand, users, demand and investor reaction based on their content, while subscription usage limits now directly change inference serving costs.',
              'gameUrl':'',
              'gameParts':[base+str(p).replace('\\','/') for p in parts],
              'gameSha256':sha,
              'sha256':sha,
              'encoding':'gzip-base64',
              'patches':[],
              'launcherUrl':'',
              'launcherSha256':'',
              'downloadUrl':'https://github.com/melissakant7-hash/ai-empire-tycoon-updates'
          }
          Path('version.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          readme=readme.replace('- Game: **v9.4.4**','- Game: **v9.4.5**',1)
          if '## v9.4.5' not in readme:
              insert='''## v9.4.5\n\nSocial consequences and usage-economics update. Posts written from the player company account are now interpreted by their content and can move reputation, brand strength, active users, consumer demand and — after an IPO — investor/share-price sentiment. Product and research announcements, transparency/safety communication, customer-friendly pricing or usage changes, margin-first cuts, layoffs, apologies, overhype and hostile communication produce different consequences. Official announcements have stronger effects, while replies have smaller effects. Each player-authored post displays its resulting company impact in the social timeline.\n\nLanguage-model subscription usage limits now have a direct serving-cost trade-off. Higher allowances increase inference/accelerator cost and lower allowances reduce it. Efficiency research, newer hardware and custom silicon reduce marginal serving cost. Finance now includes an **Inference & Usage** operating-cost line, and each released language model shows its estimated serving cost per day beside ARPU, paid mix and average usage load.\n\nThe v9.4.5 build is verified against SHA-256 `026b7a9162e86b12f74d82979fac90f733a9f681bcd76e5bba4c2f08b4192ac8`.\n\n'''
              readme=readme.replace('## v9.4.4\n',insert+'## v9.4.4\n',1)
          Path('README.md').write_text(readme,encoding='utf-8')
          print('Generated',len(parts),'parts')
          PY

      - name: Reconstruct published package one final time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.5/part*.txt > /tmp/v945-final.b64
          base64 -d /tmp/v945-final.b64 > /tmp/v945-final.gz
          gzip -dc /tmp/v945-final.gz > /tmp/v945-final.html
          echo '026b7a9162e86b12f74d82979fac90f733a9f681bcd76e5bba4c2f08b4192ac8  /tmp/v945-final.html' | sha256sum -c -

      - name: Publish v9.4.5 update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Empire Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- packages/v9.4.5 version.json README.md
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
          else
            git commit -m 'Publish AI Empire Tycoon v9.4.5 social consequences and usage economics'
            git push
          fi
