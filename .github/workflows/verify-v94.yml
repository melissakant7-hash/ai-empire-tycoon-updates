name: Verify AI Empire Tycoon v9.4

on:
  push:
    paths:
      - 'packages/v9.4/**'
      - 'version.json'
      - '.github/workflows/verify-v94.yml'
  pull_request:
    paths:
      - 'packages/v9.4/**'
      - 'version.json'
      - '.github/workflows/verify-v94.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct published v9.4 package
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4/part*.txt > /tmp/v94.b64
          base64 -d /tmp/v94.b64 > /tmp/v94.html.gz
          gzip -dc /tmp/v94.html.gz > /tmp/v94.html
          echo 'ba72a662a7305e8b441c29927fb006565698440eddc48422447f137941bdf66d  /tmp/v94.html' | sha256sum -c -
      - name: Syntax-check game JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/v94.html').read_text(encoding='utf-8')
          assert 'AI Empire Tycoon v9.4' in s
          assert 'Disable Live AI Agents' in s
          assert 'PROJECT ORION' in s
          assert 'Consumer AI Product' in s
          assert 'Custom AI Silicon' in s
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/v94.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v94.js
