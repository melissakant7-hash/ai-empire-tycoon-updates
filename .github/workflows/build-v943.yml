name: Build and publish AI Empire Tycoon v9.4.3

on:
  pull_request:
    paths:
      - 'build/v9.4.3/**'
      - '.github/workflows/build-v943.yml'
  push:
    branches: [main]
    paths:
      - 'build/v9.4.3/**'
      - '.github/workflows/build-v943.yml'

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v9.4.2 base
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.2/part*.txt > /tmp/v942.b64
          base64 -d /tmp/v942.b64 > /tmp/v942.html.gz
          gzip -dc /tmp/v942.html.gz > /tmp/old
          echo '904e46f54f63843986c6a0b7289f0e37b206184e21a5402a2dee6aba1f54ce66  /tmp/old' | sha256sum -c -

      - name: Apply v9.4.3 subscription usage controls
        shell: bash
        run: |
          set -euo pipefail
          cat build/v9.4.3/patch*.txt > /tmp/v943.patch.b64
          base64 -d /tmp/v943.patch.b64 > /tmp/v943.patch.gz
          gzip -dc /tmp/v943.patch.gz > /tmp/v943.patch
          cd /tmp
          patch old < v943.patch
          echo '728ac8d99ae1ebacf14cd245aba63e510c909f7dde83b8c170c3b1bd00602109  /tmp/old' | sha256sum -c -

      - name: Verify subscription usage controls and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AI Empire Tycoon v9.4.3' /tmp/old
          grep -q '5× higher than Free' /tmp/old
          grep -q '5× higher than Plus' /tmp/old
          grep -q '20× higher than Plus' /tmp/old
          grep -q 'usageLimitDefinitionsV943' /tmp/old
          grep -q 'data-usage-key' /tmp/old
          grep -q 'setUsageLimitV943' /tmp/old
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/old').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/v943.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v943.js

      - name: Package v9.4.3 and update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/v9.4.3
          mkdir -p packages/v9.4.3
          gzip -n -9 -c /tmp/old > /tmp/v943.html.gz
          base64 -w0 /tmp/v943.html.gz > /tmp/v943.b64
          split -b 10000 -d -a 2 --additional-suffix=.txt /tmp/v943.b64 packages/v9.4.3/part
          python3 - <<'PY'
          from pathlib import Path
          import json
          parts=sorted(Path('packages/v9.4.3').glob('part*.txt'))
          base='https://raw.githubusercontent.com/melissakant7-hash/ai-empire-tycoon-updates/main/'
          sha='728ac8d99ae1ebacf14cd245aba63e510c909f7dde83b8c170c3b1bd00602109'
          manifest={
              'latestVersion':'9.4.3',
              'required':False,
              'autoUpdate':True,
              'message':'v9.4.3 restores the subscription usage labels and adds per-model usage-limit controls for Plus, Pro x5 and Pro x20 in Model Labs.',
              'gameUrl':'',
              'gameParts':[base+str(p).replace('\\','/') for p in parts],
              'gameSha256':sha,
              'sha256':sha,
              'encoding':'gzip-base64',
              'patches':[],
              'launcherUrl':'',
              'launcherSha256':'',
              'downloadUrl':'https://github.com/melissakant7-hash/ai-empire-tycoon-updates'
          }
          Path('version.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          readme=readme.replace('- Game: **v9.4.2**','- Game: **v9.4.3**',1)
          if '## v9.4.3' not in readme:
              insert='''## v9.4.3\n\nSmall Model Labs subscription-management update. The paid-tier badges again show their real usage relationship — **Plus: 5× higher than Free**, **Pro x5: 5× higher than Plus**, and **Pro x20: 20× higher than Plus** by default — instead of the generic “subscription” label. Each released language model now also has a second slider per paid tier for managing that model’s usage allowance. Usage choices are saved per model and feed into paid-tier demand and average usage load.\n\nThe v9.4.3 build is verified against SHA-256 `728ac8d99ae1ebacf14cd245aba63e510c909f7dde83b8c170c3b1bd00602109`.\n\n'''
              readme=readme.replace('## v9.4.2\n',insert+'## v9.4.2\n',1)
          Path('README.md').write_text(readme,encoding='utf-8')
          print('Generated',len(parts),'parts')
          PY

      - name: Reconstruct published package one final time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.3/part*.txt > /tmp/v943-final.b64
          base64 -d /tmp/v943-final.b64 > /tmp/v943-final.gz
          gzip -dc /tmp/v943-final.gz > /tmp/v943-final.html
          echo '728ac8d99ae1ebacf14cd245aba63e510c909f7dde83b8c170c3b1bd00602109  /tmp/v943-final.html' | sha256sum -c -

      - name: Publish v9.4.3 update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Empire Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- packages/v9.4.3 version.json README.md
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
          else
            git commit -m 'Publish AI Empire Tycoon v9.4.3 subscription usage controls'
            git push
          fi
