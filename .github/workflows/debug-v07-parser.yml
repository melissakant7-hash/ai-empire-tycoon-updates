name: Diagnose City Bank v0.7 Parser

on:
  push:
    branches:
      - city-bank-tycoon-build
    paths:
      - ".github/workflows/debug-v07-parser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact v0.7
        shell: bash
        run: |
          cat city-bank-v04-source/part*.b64 | base64 -d > base.zip
          echo "c1ccfbac76568deb1ca5a6be2982a10d7b825597fd2fcc71957379d1b859da3a  base.zip" | sha256sum -c -
          unzip -q base.zip
          cat city-bank-v05-patch/part*.patch > v05.patch
          git apply --directory=city_bank_tycoon v05.patch
          git apply --directory=city_bank_tycoon city-bank-v05-patch/layout-hotfix.patch
          rm -f city_bank_tycoon/assets/city_reference_world.jpg
          rmdir city_bank_tycoon/assets 2>/dev/null || true
          cat city-bank-v06-patch/part*.patch > v06.patch
          git apply city-bank-v06-patch/transport-fix.patch
          git apply -p2 --directory=city_bank_tycoon v06.patch
          cat city-bank-v07-patch/part*.patch > v07.patch
          git apply city-bank-v07-patch/transport-fix.patch
          echo "d894e70bc11784769c41028ae57d56c45d71fc8f6284c753acb874c14e004902  v07.patch" | sha256sum -c -
          git apply -p2 --directory=city_bank_tycoon v07.patch
          git apply --directory=city_bank_tycoon city-bank-v07-patch/runtime-hotfix.patch
      - name: Check city_map parser directly
        shell: bash
        run: |
          set +e
          godot --headless --path city_bank_tycoon --check-only --script res://scripts/city_map.gd 2>&1 | tee parser.log
          status=${PIPESTATUS[0]}
          echo "PARSER_STATUS=$status"
          cat parser.log
          exit "$status"
