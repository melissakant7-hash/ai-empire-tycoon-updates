name: Build and publish AI Empire Tycoon v9.4.10

on:
  pull_request:
    paths:
      - 'build/v9.4.10/**'
      - '.github/workflows/build-v9410.yml'
  push:
    branches: [main]
    paths:
      - 'build/v9.4.10/**'
      - '.github/workflows/build-v9410.yml'

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v9.4.9 base
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.9/part*.txt > /tmp/v949.b64
          base64 -d /tmp/v949.b64 > /tmp/v949.html.gz
          gzip -dc /tmp/v949.html.gz > /tmp/old
          echo '9ea7e933e7b3e4127895533e35e1ddc764f99b5ffb0e6143cadcf1535712f77a  /tmp/old' | sha256sum -c -

      - name: Apply v9.4.10 Local AI pacing hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat build/v9.4.10/patch*.txt > /tmp/v9410.patch.b64
          base64 -d /tmp/v9410.patch.b64 > /tmp/v9410.patch.gz
          gzip -dc /tmp/v9410.patch.gz > /tmp/v9410.patch
          cd /tmp
          patch old < v9410.patch
          echo 'e4c59333b7af77ffb1f4d9c6e5c13a0aa5b887220db90cc5b29911d1294bcf0b  /tmp/old' | sha256sum -c -

      - name: Verify v9.4.10 pacing and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AI Empire Tycoon v9.4.10' /tmp/old
          grep -q 'SOCIAL_MIN_REAL_MS_V948=1800' /tmp/old
          grep -q 'SOCIAL_MAX_ACTIVE_THREADS_V949=6' /tmp/old
          grep -q 'SOCIAL_SOFT_ACTIVE_THREADS_V949=4' /tmp/old
          grep -q 'shouldAutonomousPostThreadV949' /tmp/old
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/old').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('No script block found')
          Path('/tmp/v9410.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v9410.js

      - name: Package v9.4.10 and update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/v9.4.10
          mkdir -p packages/v9.4.10
          gzip -n -9 -c /tmp/old > /tmp/v9410.html.gz
          base64 -w0 /tmp/v9410.html.gz > /tmp/v9410.b64
          split -b 10000 -d -a 2 --additional-suffix=.txt /tmp/v9410.b64 packages/v9.4.10/part
          python3 - <<'PY'
          from pathlib import Path
          import json
          parts=sorted(Path('packages/v9.4.10').glob('part*.txt'))
          base='https://raw.githubusercontent.com/melissakant7-hash/ai-empire-tycoon-updates/main/'
          sha='e4c59333b7af77ffb1f4d9c6e5c13a0aa5b887220db90cc5b29911d1294bcf0b'
          manifest={
            'latestVersion':'9.4.10','required':False,'autoUpdate':True,
            'message':'v9.4.10 speeds up Local AI Social Media generation by about 33%, reducing the real-time pacing interval from 2.4s to 1.8s while keeping the bounded thread scheduler and anti-spam protections unchanged.',
            'gameUrl':'','gameParts':[base+str(p).replace('\\','/') for p in parts],
            'gameSha256':sha,'sha256':sha,'encoding':'gzip-base64','patches':[],
            'launcherUrl':'','launcherSha256':'','downloadUrl':'https://github.com/melissakant7-hash/ai-empire-tycoon-updates'
          }
          Path('version.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          readme=readme.replace('- Game: **v9.4.9**','- Game: **v9.4.10**',1)
          if '## v9.4.10' not in readme:
            insert='''## v9.4.10\n\nLocal AI pacing hotfix. Local-AI Social Media generation is about 33% faster, with the minimum real-time interval reduced from 2.4 seconds to 1.8 seconds. The bounded v9.4.9 thread scheduler, active-conversation caps, fair reply draining, AI-only behavior and anti-spam protections are unchanged.\n\nThe v9.4.10 build is verified against SHA-256 `e4c59333b7af77ffb1f4d9c6e5c13a0aa5b887220db90cc5b29911d1294bcf0b`.\n\n'''
            readme=readme.replace('## v9.4.9\n',insert+'## v9.4.9\n',1)
          Path('README.md').write_text(readme,encoding='utf-8')
          print('Generated',len(parts),'parts')
          PY

      - name: Reconstruct published package one final time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.10/part*.txt > /tmp/v9410-final.b64
          base64 -d /tmp/v9410-final.b64 > /tmp/v9410-final.gz
          gzip -dc /tmp/v9410-final.gz > /tmp/v9410-final.html
          echo 'e4c59333b7af77ffb1f4d9c6e5c13a0aa5b887220db90cc5b29911d1294bcf0b  /tmp/v9410-final.html' | sha256sum -c -

      - name: Publish v9.4.10 update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Empire Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- packages/v9.4.10 version.json README.md
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
          else
            git commit -m 'Publish AI Empire Tycoon v9.4.10 faster Local AI pacing'
            git push
          fi
