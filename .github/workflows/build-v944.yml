name: Build and publish AI Empire Tycoon v9.4.4

on:
  pull_request:
    paths:
      - 'build/v9.4.4/**'
      - '.github/workflows/build-v944.yml'
  push:
    branches: [main]
    paths:
      - 'build/v9.4.4/**'
      - '.github/workflows/build-v944.yml'

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v9.4.3 base
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.3/part*.txt > /tmp/v943.b64
          base64 -d /tmp/v943.b64 > /tmp/v943.html.gz
          gzip -dc /tmp/v943.html.gz > /tmp/old
          echo '728ac8d99ae1ebacf14cd245aba63e510c909f7dde83b8c170c3b1bd00602109  /tmp/old' | sha256sum -c -

      - name: Apply v9.4.4 social-media remake
        shell: bash
        run: |
          set -euo pipefail
          cat build/v9.4.4/patch*.txt > /tmp/v944.patch.b64
          base64 -d /tmp/v944.patch.b64 > /tmp/v944.patch.gz
          gzip -dc /tmp/v944.patch.gz > /tmp/v944.patch
          cd /tmp
          patch old < v944.patch
          echo '70a3376f101e211dc65b05db0115497de7ff94e8ae1d551cff75dc04797423c7  /tmp/old' | sha256sum -c -

      - name: Verify social remake and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AI Empire Tycoon v9.4.4' /tmp/old
          grep -q 'Your Company Account' /tmp/old
          grep -q 'SOCIAL_MIN_REAL_MS_V944' /tmp/old
          grep -q 'pricingReactionTopicV944' /tmp/old
          grep -q 'postPlayerSocialV944' /tmp/old
          grep -q 'socialActionBtn' /tmp/old
          grep -q 'hotDebateGrid' /tmp/old
          grep -q 'Open full thread' /tmp/old
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/old').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/v944.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v944.js

      - name: Package v9.4.4 and update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/v9.4.4
          mkdir -p packages/v9.4.4
          gzip -n -9 -c /tmp/old > /tmp/v944.html.gz
          base64 -w0 /tmp/v944.html.gz > /tmp/v944.b64
          split -b 10000 -d -a 2 --additional-suffix=.txt /tmp/v944.b64 packages/v9.4.4/part
          python3 - <<'PY'
          from pathlib import Path
          import json
          parts=sorted(Path('packages/v9.4.4').glob('part*.txt'))
          base='https://raw.githubusercontent.com/melissakant7-hash/ai-empire-tycoon-updates/main/'
          sha='70a3376f101e211dc65b05db0115497de7ff94e8ae1d551cff75dc04797423c7'
          manifest={
              'latestVersion':'9.4.4',
              'required':False,
              'autoUpdate':True,
              'message':'v9.4.4 remakes Social Media into a slower interactive X-style network with player posts and announcements, likes/reposts, openable reply threads, multiple persistent Hot Debates, stronger AI novelty, and price/usage-limit reactions.',
              'gameUrl':'',
              'gameParts':[base+str(p).replace('\\','/') for p in parts],
              'gameSha256':sha,
              'sha256':sha,
              'encoding':'gzip-base64',
              'patches':[],
              'launcherUrl':'',
              'launcherSha256':'',
              'downloadUrl':'https://github.com/melissakant7-hash/ai-empire-tycoon-updates'
          }
          Path('version.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          readme=readme.replace('- Game: **v9.4.3**','- Game: **v9.4.4**',1)
          if '## v9.4.4' not in readme:
              insert='''## v9.4.4\n\nSocial Media remake and pacing hotfix. The timeline now behaves more like an interactive X/Twitter feed: the player can post from the company account or publish marked official announcements, like and repost posts, open full reply threads and reply as the company. Latest Posts shows root posts rather than flattening every reply into the main feed. Hot Debate keeps up to four active conversations visible at once instead of replacing the only visible debate whenever the simulation refreshes.\n\nAutonomous posting is rate-limited in both real time and simulation time so 5× Sandbox speed no longer floods the feed. When Live AI Agents are enabled and an on-device LanguageModel session is actually available, Live AI is preferred for new autonomous root posts rather than being added on top of a template post. Both Live AI and simulation fallback use stronger anti-repetition checks; the fallback now varies perspective by persona and role. Subscription price and usage-limit changes can enter the social discussion with concrete judgments about whether a tier is restrictive, generous or worth its price.\n\nThe v9.4.4 build is verified against SHA-256 `70a3376f101e211dc65b05db0115497de7ff94e8ae1d551cff75dc04797423c7`.\n\n'''
              readme=readme.replace('## v9.4.3\n',insert+'## v9.4.3\n',1)
          Path('README.md').write_text(readme,encoding='utf-8')
          print('Generated',len(parts),'parts')
          PY

      - name: Reconstruct published package one final time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.4/part*.txt > /tmp/v944-final.b64
          base64 -d /tmp/v944-final.b64 > /tmp/v944-final.gz
          gzip -dc /tmp/v944-final.gz > /tmp/v944-final.html
          echo '70a3376f101e211dc65b05db0115497de7ff94e8ae1d551cff75dc04797423c7  /tmp/v944-final.html' | sha256sum -c -

      - name: Publish v9.4.4 update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Empire Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- packages/v9.4.4 version.json README.md
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
          else
            git commit -m 'Publish AI Empire Tycoon v9.4.4 social media remake'
            git push
          fi
