name: Build City Bank Tycoon Windows

on:
  push:
    branches:
      - city-bank-tycoon-build
    paths:
      - "city-bank-v04-source/**"
      - "city-bank-v05-patch/**"
      - ".github/workflows/city-bank-tycoon-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    name: Export Windows x64
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reassemble v0.4 base and apply exact v0.5 patch
        shell: bash
        run: |
          cat city-bank-v04-source/part*.b64 | base64 -d > city-bank-tycoon-v04-source.zip
          echo "c1ccfbac76568deb1ca5a6be2982a10d7b825597fd2fcc71957379d1b859da3a  city-bank-tycoon-v04-source.zip" | sha256sum -c -
          unzip -q city-bank-tycoon-v04-source.zip
          cat city-bank-v05-patch/part*.patch > v05.patch
          echo "15b130b9ff2bb5e707b27b15321a8eb43f76530c12570635c25bda2275a3f452  v05.patch" | sha256sum -c -
          patch -p1 -d city_bank_tycoon < "$GITHUB_WORKSPACE/v05.patch"
          rm -f city_bank_tycoon/assets/city_reference_world.jpg
          rmdir city_bank_tycoon/assets 2>/dev/null || true
          test -f city_bank_tycoon/project.godot
          test -f city_bank_tycoon/scripts/main.gd
          test -f city_bank_tycoon/scripts/city_map.gd
          test -f city_bank_tycoon/scripts/document_paper.gd
          test -f city_bank_tycoon/scripts/signature_pad.gd
          grep -q 'config/version="0.5.0"' city_bank_tycoon/project.godot
          if grep -R -qE 'city_reference_world|res://assets' city_bank_tycoon; then
            echo 'Photographic city reference is still present in the v0.5 source.'
            exit 1
          fi

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/"
          fi
          godot --version

      - name: Import and validate game
        shell: bash
        run: |
          set +e
          godot --headless --path city_bank_tycoon --editor --quit 2>&1 | tee import.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -qE 'SCRIPT ERROR: Parse Error|Failed to load script.*Parse error' import.log; then
            echo 'GDScript validation failed.'
            exit 1
          fi

      - name: Run v0.5 UI, product and city smoke test
        shell: bash
        run: |
          cat > city_bank_tycoon/ci_smoke.gd <<'GDSCRIPT'
          extends SceneTree

          func fail(message: String) -> void:
              push_error(message)
              quit(1)

          func has_button_text(node: Node, wanted: String) -> bool:
              if node is Button and String(node.text) == wanted:
                  return true
              for child in node.get_children():
                  if has_button_text(child, wanted):
                      return true
              return false

          func _initialize():
              call_deferred("_run")

          func _run():
              var packed = load("res://main.tscn")
              if packed == null:
                  fail("Could not load main scene")
                  return
              var game = packed.instantiate()
              root.add_child(game)
              await process_frame
              await process_frame
              await process_frame

              if game.city_world == null:
                  fail("Persistent native city world missing")
                  return
              if bool(game.policy.get("auto_loans_enabled", true)):
                  fail("Auto Loans must be disabled by default")
                  return
              for application in game.applications:
                  if String(application.type) == "Auto Loan":
                      fail("Auto Loan generated while product is disabled")
                      return

              game._show_view("Mail")
              await process_frame
              await process_frame
              if game.current_view != "Mail":
                  fail("Mail did not open")
                  return
              if game.content.get_child_count() < 1:
                  fail("Mail overlay missing")
                  return
              var mail_overlay = game.content.get_child(0)
              if not has_button_text(mail_overlay, "✕"):
                  fail("Mail overlay has no close X")
                  return
              var mail_rect = game.content.get_global_rect()
              var district_rect = game.district_panel.get_global_rect()
              if mail_rect.end.x > district_rect.position.x + 0.5:
                  fail("Mail UI overlaps the district overview")
                  return

              game._toggle_view("Mail")
              await process_frame
              await process_frame
              if game.current_view != "" or game.content.get_child_count() != 0:
                  fail("Clicking Mail a second time did not close it")
                  return
              game._toggle_view("Mail")
              await process_frame
              await process_frame
              if game.current_view != "Mail" or game.content.get_child_count() < 1:
                  fail("Mail did not reopen after toggle")
                  return

              if not has_button_text(game.district_panel, "✕"):
                  fail("District overview has no close X")
                  return
              game.district_panel.visible = false
              game._on_district_selected("Financial District")
              await process_frame
              if not game.district_panel.visible:
                  fail("Clicking a district did not reopen the overview")
                  return

              var old_zoom = float(game.city_world.view_zoom)
              game.city_world._zoom_at(Vector2(500, 400), 1.12)
              if float(game.city_world.view_zoom) <= old_zoom:
                  fail("Native city camera zoom failed")
                  return
              if game.city_world.cars.size() < 80 or game.city_world.pedestrians.size() < 250:
                  fail("Living city traffic/pedestrian population was not expanded")
                  return

              game.applications.clear()
              game.mail_messages.clear()
              game.policy["auto_loans_enabled"] = false
              for i in range(80):
                  game._generate_application()
              for application in game.applications:
                  if String(application.type) == "Auto Loan":
                      fail("Disabled Auto Loans still generated applications")
                      return

              game._set_auto_loans_enabled(true)
              game.applications.clear()
              game.mail_messages.clear()
              var found_auto = false
              for i in range(320):
                  game._generate_application()
                  if not game.applications.is_empty() and String(game.applications.back().type) == "Auto Loan":
                      found_auto = true
                      break
              if not found_auto:
                  fail("Enabling Auto Loans did not allow vehicle-finance applications")
                  return

              game.applications.clear()
              game.mail_messages.clear()
              var chosen_index = -1
              for i in range(100):
                  game._generate_application()
                  if not game.applications.is_empty():
                      var candidate_index = game.applications.size() - 1
                      var candidate_type = String(game.applications[candidate_index].type)
                      if candidate_type != "Mortgage" and candidate_type != "Auto Loan":
                          chosen_index = candidate_index
                          break
              if chosen_index < 0:
                  fail("Could not generate deterministic approvable document case")
                  return
              game.bank.cash = max(float(game.bank.cash), 1000000000.0)
              var app_id = int(game.applications[chosen_index].id)
              game._select_mail_for_application(app_id)
              game._show_view("Mail")
              await process_frame
              await process_frame
              game._open_attachment(app_id, 0)
              await process_frame
              if game.active_document_modal == null:
                  fail("Document modal did not open")
                  return
              game._set_active_document_stamp("APPROVED")
              var app_index = game._active_application_index_by_id(app_id)
              if app_index < 0:
                  fail("Active application disappeared before signing")
                  return
              var app = game.applications[app_index]
              var doc = app.documents[0]
              doc.signed = true
              doc.signature_points = [[0.1,0.6],[0.25,0.4],[0.4,0.65],[0.6,0.35],[0.8,0.55]]
              app.documents[0] = doc
              game.applications[app_index] = app
              game._refresh_active_document()
              await process_frame
              game._finalize_document_decision()
              await process_frame
              if game.loans.size() < 1:
                  fail("Signed and APPROVED case did not enter portfolio")
                  return

              for i in range(35):
                  game._advance_day()
              await process_frame
              print("CI_V05_UI_AUTO_CITY_DOCUMENT_SMOKE_OK")
              quit(0)
          GDSCRIPT
          set +e
          godot --headless --path city_bank_tycoon -s res://ci_smoke.gd 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -q 'CI_V05_UI_AUTO_CITY_DOCUMENT_SMOKE_OK' smoke.log
          if grep -qE 'SCRIPT ERROR|Invalid call|Invalid access|Parse Error|Attempt to call' smoke.log; then
            echo 'Gameplay smoke test found a script/runtime error.'
            exit 1
          fi
          rm -f city_bank_tycoon/ci_smoke.gd

      - name: Export native Windows executable
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/windows"
          godot --headless --path city_bank_tycoon --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/windows/CityBankTycoon-v0.5.exe" 2>&1 | tee export.log
          test -f "$GITHUB_WORKSPACE/build/windows/CityBankTycoon-v0.5.exe"
          ls -lah "$GITHUB_WORKSPACE/build/windows/CityBankTycoon-v0.5.exe"

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CityBankTycoon-v0.5-Windows-x64
          path: build/windows/CityBankTycoon-v0.5.exe
          if-no-files-found: error
          retention-days: 30
