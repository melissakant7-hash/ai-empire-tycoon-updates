name: Build City Bank Tycoon Windows

on:
  push:
    branches:
      - city-bank-tycoon-build
    paths:
      - "city-bank-v02-source/**"
      - ".github/workflows/city-bank-tycoon-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    name: Export Windows x64
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reassemble City Bank Tycoon v0.2 source
        shell: bash
        run: |
          cat city-bank-v02-source/part*.b64 | base64 -d > city-bank-tycoon-v02-source.zip
          echo "04000a9ac317701f2b0c299175da4bb54b446c792b515a3b54c2b6fdd4510bc7  city-bank-tycoon-v02-source.zip" | sha256sum -c -
          unzip -q city-bank-tycoon-v02-source.zip
          test -f city_bank_tycoon/project.godot
          test -f city_bank_tycoon/export_presets.cfg
          test -f city_bank_tycoon/scripts/main.gd
          test -f city_bank_tycoon/scripts/core/save_manager.gd
          test -f city_bank_tycoon/scripts/line_chart.gd
          if grep -R -n ':=' city_bank_tycoon/scripts; then
            echo 'Build-time compatibility syntax still exists in source.'
            exit 1
          fi

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/"
          fi
          godot --version

      - name: Import and validate game
        shell: bash
        run: |
          set +e
          godot --headless --path city_bank_tycoon --editor --quit 2>&1 | tee import.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -qE 'SCRIPT ERROR: Parse Error|Failed to load script.*Parse error' import.log; then
            echo 'GDScript validation failed.'
            exit 1
          fi

      - name: Run gameplay smoke test
        shell: bash
        run: |
          cat > city_bank_tycoon/ci_smoke.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize():
              call_deferred("_run")

          func _run():
              var packed = load("res://main.tscn")
              if packed == null:
                  push_error("Could not load main scene")
                  quit(1)
                  return
              var game = packed.instantiate()
              root.add_child(game)
              await process_frame
              var views = ["Dashboard", "Loan Desk", "Loan Portfolio", "Customers", "Businesses", "Bank Policies", "Taxes", "City Economy", "Housing", "City Map", "Competitors", "Reports", "News", "Settings"]
              for view_name in views:
                  game._show_view(view_name)
                  await process_frame
              for i in range(35):
                  game._advance_day()
              game._show_view("Dashboard")
              await process_frame
              print("CI_SMOKE_TEST_OK")
              quit(0)
          GDSCRIPT
          set +e
          godot --headless --path city_bank_tycoon -s res://ci_smoke.gd 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -q 'CI_SMOKE_TEST_OK' smoke.log
          if grep -qE 'SCRIPT ERROR|Invalid call|Invalid access|Parse Error|Attempt to call' smoke.log; then
            echo 'Gameplay smoke test found a script/runtime error.'
            exit 1
          fi
          rm -f city_bank_tycoon/ci_smoke.gd

      - name: Export native Windows executable
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/windows"
          set +e
          godot --headless --path city_bank_tycoon --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/windows/CityBankTycoon-v0.2.exe" 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -qE 'SCRIPT ERROR: Parse Error|Failed to load script.*Parse error' export.log; then
            echo 'Export contained GDScript parse errors.'
            exit 1
          fi
          test -f "$GITHUB_WORKSPACE/build/windows/CityBankTycoon-v0.2.exe"
          ls -lah "$GITHUB_WORKSPACE/build/windows/CityBankTycoon-v0.2.exe"

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CityBankTycoon-v0.2-Windows-x64
          path: build/windows/CityBankTycoon-v0.2.exe
          if-no-files-found: error
          retention-days: 30
