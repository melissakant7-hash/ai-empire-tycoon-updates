name: Build City Bank Tycoon Windows

on:
  push:
    branches:
      - city-bank-tycoon-build
    paths:
      - "city-bank-source/**"
      - ".github/workflows/city-bank-tycoon-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    name: Export Windows x64
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reassemble City Bank Tycoon source
        shell: bash
        run: |
          cat city-bank-source/part*.b64 | base64 -d > city-bank-tycoon-source.zip
          echo "876d0b94ff888e94db74d9cb1c382ceb9691df61950857bd67d2f558f48be0e4  city-bank-tycoon-source.zip" | sha256sum -c -
          unzip -q city-bank-tycoon-source.zip
          test -f city_bank_tycoon/project.godot
          test -f city_bank_tycoon/export_presets.cfg

      - name: Apply Godot 4.7 compatibility fix
        shell: bash
        run: |
          sed -i 's/:=/=/g' city_bank_tycoon/scripts/main.gd city_bank_tycoon/scripts/city_map.gd

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/"
          fi
          godot --version

      - name: Import and validate game
        shell: bash
        run: |
          set +e
          godot --headless --path city_bank_tycoon --editor --quit 2>&1 | tee import.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -qE 'SCRIPT ERROR: Parse Error|Failed to load script.*Parse error' import.log; then
            echo 'GDScript validation failed.'
            exit 1
          fi

      - name: Export native Windows executable
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/windows"
          set +e
          godot --headless --path city_bank_tycoon --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/windows/CityBankTycoon.exe" 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -qE 'SCRIPT ERROR: Parse Error|Failed to load script.*Parse error' export.log; then
            echo 'Export contained GDScript parse errors.'
            exit 1
          fi
          test -f "$GITHUB_WORKSPACE/build/windows/CityBankTycoon.exe"
          ls -lah "$GITHUB_WORKSPACE/build/windows/CityBankTycoon.exe"

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CityBankTycoon-Windows-x64
          path: build/windows/CityBankTycoon.exe
          if-no-files-found: error
          retention-days: 30
