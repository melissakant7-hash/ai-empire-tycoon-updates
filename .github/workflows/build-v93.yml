name: Build and publish AI Empire Tycoon v9.3

on:
  push:
    paths:
      - 'build/v9.3/**'
      - '.github/workflows/build-v93.yml'

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v9.2.1 base
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.2.1/part*.txt > /tmp/v921.b64
          base64 -d /tmp/v921.b64 > /tmp/v921.html.gz
          gzip -dc /tmp/v921.html.gz > /tmp/old
          echo '0cc226a5bf055e81fb0516b9a98caf2ebaf3b76e99c37f22018933db76b160e9  /tmp/old' | sha256sum -c -

      - name: Apply verified v9.3 patch
        shell: bash
        run: |
          set -euo pipefail
          cat build/v9.3/patch*.txt > /tmp/v93.patch.b64
          base64 -d /tmp/v93.patch.b64 > /tmp/v93.patch.gz
          gzip -dc /tmp/v93.patch.gz > /tmp/v93.patch
          cd /tmp
          patch old < v93.patch
          echo '6a8c6a60207ef85b88469aa591e3d7597da55dcda1fea3e2b57ee56bcda7acee  /tmp/old' | sha256sum -c -

      - name: Syntax-check v9.3 JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('/tmp/old').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', s, re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/v93-script.js').write_text(m.group(1), encoding='utf-8')
          assert 'AI Empire Tycoon v9.3' in s
          PY
          node --check /tmp/v93-script.js

      - name: Package v9.3 and generate manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/v9.3
          mkdir -p packages/v9.3
          gzip -n -9 -c /tmp/old > /tmp/v93.html.gz
          base64 -w0 /tmp/v93.html.gz > /tmp/v93.b64
          split -b 10000 -d -a 2 --additional-suffix=.txt /tmp/v93.b64 packages/v9.3/part
          python3 - <<'PY'
          from pathlib import Path
          import json
          parts = sorted(Path('packages/v9.3').glob('part*.txt'))
          if not parts:
              raise SystemExit('No update parts generated')
          base = 'https://raw.githubusercontent.com/melissakant7-hash/ai-empire-tycoon-updates/main/'
          manifest = {
              'latestVersion': '9.3',
              'required': False,
              'autoUpdate': True,
              'message': 'v9.3 turns Social Media into a living agent network with persistent opinions and memories, relationships, reply/debate threads, influencers, journalists, insiders, simulation-grounded unconfirmed rumors/leaks, and richer on-device AI posts and replies.',
              'gameUrl': '',
              'gameParts': [base + str(p).replace('\\\\','/') for p in parts],
              'gameSha256': '6a8c6a60207ef85b88469aa591e3d7597da55dcda1fea3e2b57ee56bcda7acee',
              'sha256': '6a8c6a60207ef85b88469aa591e3d7597da55dcda1fea3e2b57ee56bcda7acee',
              'encoding': 'gzip-base64',
              'patches': [],
              'launcherUrl': '',
              'launcherSha256': '',
              'downloadUrl': 'https://github.com/melissakant7-hash/ai-empire-tycoon-updates'
          }
          Path('version.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print('Generated', len(parts), 'parts')
          PY

      - name: Reconstruct packaged result one final time
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.3/part*.txt > /tmp/v93-final.b64
          base64 -d /tmp/v93-final.b64 > /tmp/v93-final.gz
          gzip -dc /tmp/v93-final.gz > /tmp/v93-final.html
          echo '6a8c6a60207ef85b88469aa591e3d7597da55dcda1fea3e2b57ee56bcda7acee  /tmp/v93-final.html' | sha256sum -c -

      - name: Publish v9.3 update channel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Empire Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A packages/v9.3 version.json
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
          else
            git commit -m 'Publish AI Empire Tycoon v9.3'
            git push
          fi
