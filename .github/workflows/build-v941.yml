name: Build and publish AI Empire Tycoon v9.4.1

on:
  pull_request:
    paths:
      - 'build/v9.4.1/**'
      - '.github/workflows/build-v941.yml'
  push:
    branches: [main]
    paths:
      - 'build/v9.4.1/**'
      - '.github/workflows/build-v941.yml'

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v9.4 base
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4/part*.txt > /tmp/v94.b64
          base64 -d /tmp/v94.b64 > /tmp/v94.html.gz
          gzip -dc /tmp/v94.html.gz > /tmp/old
          echo 'ba72a662a7305e8b441c29927fb006565698440eddc48422447f137941bdf66d  /tmp/old' | sha256sum -c -

      - name: Apply v9.4.1 dropdown hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat build/v9.4.1/patch*.txt > /tmp/v941.patch.b64
          base64 -d /tmp/v941.patch.b64 > /tmp/v941.patch.gz
          gzip -dc /tmp/v941.patch.gz > /tmp/v941.patch
          cd /tmp
          patch old < v941.patch
          echo '3fe1184281b7c3abfb96057d6af98304e144f87fd2f6233dcd46934362178a96  /tmp/old' | sha256sum -c -

      - name: Verify hotfix code and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AI Empire Tycoon v9.4.1' /tmp/old
          grep -q 'v941UserEditingControl' /tmp/old
          grep -q 'v941FlushDeferredRender' /tmp/old
          grep -q 'v941ChipFocus' /tmp/old
          grep -q 'v941SecretSecrecy' /tmp/old
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/old').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/v941.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v941.js

      - name: Package v9.4.1 and update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/v9.4.1
          mkdir -p packages/v9.4.1
          gzip -n -9 -c /tmp/old > /tmp/v941.html.gz
          base64 -w0 /tmp/v941.html.gz > /tmp/v941.b64
          split -b 10000 -d -a 2 --additional-suffix=.txt /tmp/v941.b64 packages/v9.4.1/part
          python3 - <<'PY'
          from pathlib import Path
          import json
          parts=sorted(Path('packages/v9.4.1').glob('part*.txt'))
          base='https://raw.githubusercontent.com/melissakant7-hash/ai-empire-tycoon-updates/main/'
          manifest={
              'latestVersion':'9.4.1',
              'required':False,
              'autoUpdate':True,
              'message':'v9.4.1 hotfix prevents simulation refreshes from closing active dropdowns/inputs, preserves Custom AI Silicon focus and Secret Research secrecy selections, and keeps all v9.4 systems/save data intact.',
              'gameUrl':'',
              'gameParts':[base+str(p).replace('\\','/') for p in parts],
              'gameSha256':'3fe1184281b7c3abfb96057d6af98304e144f87fd2f6233dcd46934362178a96',
              'sha256':'3fe1184281b7c3abfb96057d6af98304e144f87fd2f6233dcd46934362178a96',
              'encoding':'gzip-base64',
              'patches':[],
              'launcherUrl':'',
              'launcherSha256':'',
              'downloadUrl':'https://github.com/melissakant7-hash/ai-empire-tycoon-updates'
          }
          Path('version.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          readme=readme.replace('- Game: **v9.4**','- Game: **v9.4.1**',1)
          if '## v9.4.1' not in readme:
              insert='''## v9.4.1\n\nHotfix for interaction controls that were being replaced by the simulation render loop while open. Native dropdowns and active inputs are now protected during interaction, deferred renders resume immediately after focus leaves the control, and the Custom AI Silicon focus plus Secret Research secrecy choices persist across refreshes. Existing v9.4 saves and gameplay systems remain compatible.\n\nThe v9.4.1 build is verified against SHA-256 `3fe1184281b7c3abfb96057d6af98304e144f87fd2f6233dcd46934362178a96`.\n\n'''
              readme=readme.replace('## v9.4\n',insert+'## v9.4\n',1)
          Path('README.md').write_text(readme,encoding='utf-8')
          print('Generated',len(parts),'parts')
          PY

      - name: Reconstruct published package one final time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.1/part*.txt > /tmp/v941-final.b64
          base64 -d /tmp/v941-final.b64 > /tmp/v941-final.gz
          gzip -dc /tmp/v941-final.gz > /tmp/v941-final.html
          echo '3fe1184281b7c3abfb96057d6af98304e144f87fd2f6233dcd46934362178a96  /tmp/v941-final.html' | sha256sum -c -

      - name: Publish v9.4.1 update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Empire Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- packages/v9.4.1 version.json README.md
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
          else
            git commit -m 'Publish AI Empire Tycoon v9.4.1 hotfix'
            git push
          fi
