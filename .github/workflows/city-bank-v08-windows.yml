name: Build City Bank Tycoon v0.8 Windows

on:
  push:
    branches:
      - city-bank-v08-build
    paths:
      - "city-bank-v08-patch/**"
      - ".github/workflows/city-bank-v08-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    name: Export v0.8 Windows x64
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout v0.8 build branch
        uses: actions/checkout@v4

      - name: Reassemble exact v0.8 source
        shell: bash
        run: |
          cat city-bank-v04-source/part*.b64 | base64 -d > city-bank-tycoon-v04-source.zip
          echo "c1ccfbac76568deb1ca5a6be2982a10d7b825597fd2fcc71957379d1b859da3a  city-bank-tycoon-v04-source.zip" | sha256sum -c -
          unzip -q city-bank-tycoon-v04-source.zip

          cat city-bank-v05-patch/part*.patch > v05.patch
          echo "15b130b9ff2bb5e707b27b15321a8eb43f76530c12570635c25bda2275a3f452  v05.patch" | sha256sum -c -
          echo "80a50c73f7db00be3fd55f0b01a98a2a0a6aa02f1ac37aef04bb484c44282a4e  city-bank-v05-patch/layout-hotfix.patch" | sha256sum -c -
          git apply --directory=city_bank_tycoon "$GITHUB_WORKSPACE/v05.patch"
          git apply --directory=city_bank_tycoon "$GITHUB_WORKSPACE/city-bank-v05-patch/layout-hotfix.patch"
          rm -f city_bank_tycoon/assets/city_reference_world.jpg
          rmdir city_bank_tycoon/assets 2>/dev/null || true

          cat city-bank-v06-patch/part*.patch > v06.patch
          git apply "$GITHUB_WORKSPACE/city-bank-v06-patch/transport-fix.patch"
          echo "7cb54e496b29c2aedf6740441a243489e1a37d6aa128fa0cb326f533f924caf6  v06.patch" | sha256sum -c -
          git apply -p2 --directory=city_bank_tycoon "$GITHUB_WORKSPACE/v06.patch"

          cat city-bank-v07-patch/part*.patch > v07.patch
          git apply "$GITHUB_WORKSPACE/city-bank-v07-patch/transport-fix.patch"
          echo "d894e70bc11784769c41028ae57d56c45d71fc8f6284c753acb874c14e004902  v07.patch" | sha256sum -c -
          git apply -p2 --directory=city_bank_tycoon "$GITHUB_WORKSPACE/v07.patch"
          git apply --directory=city_bank_tycoon "$GITHUB_WORKSPACE/city-bank-v07-patch/runtime-hotfix.patch"
          grep -q 'config/version="0.7.0"' city_bank_tycoon/project.godot

          cat city-bank-v08-patch/part00.patch city-bank-v08-patch/part01.patch city-bank-v08-patch/fix02_0.patch city-bank-v08-patch/fix02_1.patch city-bank-v08-patch/fix02_2.patch city-bank-v08-patch/fix02_3.patch city-bank-v08-patch/fix03_0.patch city-bank-v08-patch/fix03_1.patch city-bank-v08-patch/fix03_2.patch city-bank-v08-patch/fix03_3.patch city-bank-v08-patch/part04.patch city-bank-v08-patch/fix05_0.patch city-bank-v08-patch/fix05_1.patch city-bank-v08-patch/fix05_2.patch city-bank-v08-patch/fix05_3.patch city-bank-v08-patch/part06.patch > v08.patch
          echo "bbf45e643793ca3662d41429c31b2d20a98495715545b52f812efe073fcf34ce  v08.patch" | sha256sum -c -
          git apply -p5 --directory=city_bank_tycoon "$GITHUB_WORKSPACE/v08.patch"
          echo "8c9a9768dd2442d00893df32702fa5d76a7580959d43f67796144643869cdf7d  city-bank-v08-patch/wheel-hotfix.patch" | sha256sum -c -
          git apply -p2 --directory=city_bank_tycoon "$GITHUB_WORKSPACE/city-bank-v08-patch/wheel-hotfix.patch"
          grep -q 'config/version="0.8.0"' city_bank_tycoon/project.godot
          grep -q 'v0.8 City Visual Overhaul' city_bank_tycoon/scripts/main.gd
          grep -q 'facade_materials' city_bank_tycoon/scripts/city_map.gd
          if grep -R -qE 'city_reference_world|res://assets' city_bank_tycoon; then
            echo 'Photographic city reference returned unexpectedly.'
            exit 1
          fi

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/"
          fi
          godot --version

      - name: Parse v0.8 city world directly
        shell: bash
        run: |
          set +e
          godot --headless --path city_bank_tycoon --check-only --script res://scripts/city_map.gd 2>&1 | tee parser-v08.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -qE 'SCRIPT ERROR|Parse Error|Failed to load script' parser-v08.log; then
            echo 'v0.8 city parser validation failed.'
            exit 1
          fi

      - name: Import and validate complete game
        shell: bash
        run: |
          set +e
          godot --headless --path city_bank_tycoon --editor --quit 2>&1 | tee import.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -qE 'SCRIPT ERROR: Parse Error|Failed to load script.*Parse error' import.log; then
            echo 'GDScript validation failed.'
            exit 1
          fi

      - name: Run v0.5 banking regression
        shell: bash
        run: |
          cp city-bank-v05-patch/ci_smoke.gd city_bank_tycoon/ci_smoke.gd
          set +e
          godot --headless --path city_bank_tycoon -s res://ci_smoke.gd 2>&1 | tee smoke-v05.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -q 'CI_V05_UI_AUTO_CITY_DOCUMENT_SMOKE_OK' smoke-v05.log
          if grep -qE 'SCRIPT ERROR|Invalid call|Invalid access|Parse Error|Attempt to call' smoke-v05.log; then
            exit 1
          fi
          rm -f city_bank_tycoon/ci_smoke.gd

      - name: Run v0.6 underwriting regression
        shell: bash
        run: |
          cp city-bank-v06-patch/ci_smoke.gd city_bank_tycoon/ci_smoke.gd
          set +e
          godot --headless --path city_bank_tycoon -s res://ci_smoke.gd 2>&1 | tee smoke-v06.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -q 'CI_V06_RESPONSIVE_LOAN_AND_CITY_WORLD_OK' smoke-v06.log
          if grep -qE 'SCRIPT ERROR|Invalid call|Invalid access|Parse Error|Attempt to call' smoke-v06.log; then
            exit 1
          fi
          rm -f city_bank_tycoon/ci_smoke.gd

      - name: Run v0.7 native 3D regression
        shell: bash
        run: |
          cp city-bank-v07-patch/ci_smoke.gd city_bank_tycoon/ci_smoke.gd
          set +e
          godot --headless --path city_bank_tycoon -s res://ci_smoke.gd 2>&1 | tee smoke-v07.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -q 'CI_V07_NATIVE_3D_CITY_WORLD_OK' smoke-v07.log
          if grep -qE 'SCRIPT ERROR|Invalid call|Invalid access|Parse Error|Attempt to call' smoke-v07.log; then
            exit 1
          fi
          rm -f city_bank_tycoon/ci_smoke.gd

      - name: Run v0.8 visual city-world smoke test
        shell: bash
        run: |
          cp city-bank-v08-patch/ci_smoke.gd city_bank_tycoon/ci_smoke.gd
          set +e
          godot --headless --path city_bank_tycoon -s res://ci_smoke.gd 2>&1 | tee smoke-v08.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          grep -q 'CI_V08_CITY_VISUAL_OVERHAUL_OK' smoke-v08.log
          if grep -qE 'SCRIPT ERROR|Invalid call|Invalid access|Parse Error|Attempt to call' smoke-v08.log; then
            echo 'v0.8 visual city-world smoke test found a script/runtime error.'
            exit 1
          fi
          rm -f city_bank_tycoon/ci_smoke.gd

      - name: Export native Windows executable
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/windows"
          set +e
          godot --headless --path city_bank_tycoon --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/windows/CityBankTycoon-v0.8.exe" 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          test -f "$GITHUB_WORKSPACE/build/windows/CityBankTycoon-v0.8.exe"
          if grep -qE 'SCRIPT ERROR: Parse Error|Failed to load script.*Parse error' export.log; then
            exit 1
          fi
          ls -lah "$GITHUB_WORKSPACE/build/windows/CityBankTycoon-v0.8.exe"

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CityBankTycoon-v0.8-Windows-x64
          path: build/windows/CityBankTycoon-v0.8.exe
          if-no-files-found: error
          retention-days: 30
