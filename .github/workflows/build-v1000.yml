name: Build and publish AI Empire Tycoon v10.0.0

on:
  pull_request:
    paths:
      - 'build/v10.0.0/**'
      - '.github/workflows/build-v1000.yml'
  push:
    branches: [main]
    paths:
      - 'build/v10.0.0/**'
      - '.github/workflows/build-v1000.yml'

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v9.5.0 base
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.5.0/part*.txt > /tmp/v950.b64
          base64 -d /tmp/v950.b64 > /tmp/v950.html.gz
          gzip -dc /tmp/v950.html.gz > /tmp/old
          echo 'd78b38c33aef1fd61cf5a6fafd8769d2fa01f49952d23a7fb097d76da8d29624  /tmp/old' | sha256sum -c -

      - name: Apply v10.0.0 company and world expansion
        shell: bash
        run: |
          set -euo pipefail
          cat build/v10.0.0/patch*.txt > /tmp/v1000.patch.b64
          base64 -d /tmp/v1000.patch.b64 > /tmp/v1000.patch.gz
          gzip -dc /tmp/v1000.patch.gz > /tmp/v1000.patch
          cd /tmp
          patch old < v1000.patch
          echo '1c725b57574a89c1fca6b475038b1d9b9ef96d81b0b8ef7568f6b3d7027e6333  /tmp/old' | sha256sum -c -

      - name: Verify v10 systems and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AI Empire Tycoon v10.0.0' /tmp/old
          grep -q "const V100_VERSION='10.0.0'" /tmp/old
          grep -q 'Employees & Research Teams' /tmp/old
          grep -q 'Executive Team' /tmp/old
          grep -q 'Model Training Project' /tmp/old
          grep -q 'rivalCEOV100' /tmp/old
          grep -q 'Crisis Room' /tmp/old
          grep -q 'Startup Ecosystem & Acquisitions' /tmp/old
          grep -q 'Government & Regulation' /tmp/old
          grep -q 'Developer Ecosystem & API Reliability' /tmp/old
          grep -q 'Global release policy' /tmp/old
          grep -q 'Press & Board' /tmp/old
          grep -q 'Endgame AI Race' /tmp/old
          grep -q 'v100StartCrisis' /tmp/old
          grep -q 'startRaceProjectV100' /tmp/old
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/old').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('No script block found')
          Path('/tmp/v1000.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v1000.js

      - name: Package v10.0.0 and update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/v10.0.0
          mkdir -p packages/v10.0.0
          gzip -n -9 -c /tmp/old > /tmp/v1000.html.gz
          base64 -w0 /tmp/v1000.html.gz > /tmp/v1000.b64
          split -b 10000 -d -a 2 --additional-suffix=.txt /tmp/v1000.b64 packages/v10.0.0/part
          python3 - <<'PY'
          from pathlib import Path
          import json
          parts=sorted(Path('packages/v10.0.0').glob('part*.txt'))
          base='https://raw.githubusercontent.com/melissakant7-hash/ai-empire-tycoon-updates/main/'
          sha='1c725b57574a89c1fca6b475038b1d9b9ef96d81b0b8ef7568f6b3d7027e6333'
          manifest={
            'latestVersion':'10.0.0','required':False,'autoUpdate':True,
            'message':'v10.0.0 expands company gameplay with employees and teams, executives, real training programs, rival CEOs, crises, startups and acquisitions, regulation, developer/API operations, safety choices, press and board pressure, and a late-game frontier AI race.',
            'gameUrl':'','gameParts':[base+str(p).replace('\\','/') for p in parts],
            'gameSha256':sha,'sha256':sha,'encoding':'gzip-base64','patches':[],
            'launcherUrl':'','launcherSha256':'','downloadUrl':'https://github.com/melissakant7-hash/ai-empire-tycoon-updates'
          }
          Path('version.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          readme=readme.replace('- Game: **v9.5.0**','- Game: **v10.0.0**',1)
          if '## v10.0.0' not in readme:
            insert='''## v10.0.0\n\nMajor company-and-world gameplay expansion. The new Company HQ connects workforce allocation and morale, executive hiring, crisis management, startup acquisitions, government/regulatory posture, developer ecosystem and API reliability, press interviews, board/investor pressure, and the late-game frontier AI race. Model Lab gains real training-program decisions for compute budget, data program and safety gates; release safety policy now changes cost/risk; rival CEOs have persistent personalities and periodic strategic behavior. Startups evolve and can be acquired by the player or rivals, developer adoption responds to uptime/support, outages can escalate into crises, and frontier moonshots provide a costly endgame path to permanent capability breakthroughs.\n\nAlso included from the requested numbered ideas: AI Safety/Alignment Decisions (#7), Government & Regulation (#8), API Reliability/Outages (#14), Scandals & Crisis Management (#17), Press Conferences/Interviews (#18), Board/Investor Pressure (#19), and Endgame/AI Race (#20). Model Training Projects (#4) is integrated into Model Lab rather than duplicated.\n\nThe v10.0.0 build is verified against SHA-256 `1c725b57574a89c1fca6b475038b1d9b9ef96d81b0b8ef7568f6b3d7027e6333`.\n\n'''
            readme=readme.replace('## v9.5.0\n',insert+'## v9.5.0\n',1)
          Path('README.md').write_text(readme,encoding='utf-8')
          print('Generated',len(parts),'parts')
          PY

      - name: Reconstruct published package one final time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v10.0.0/part*.txt > /tmp/v1000-final.b64
          base64 -d /tmp/v1000-final.b64 > /tmp/v1000-final.gz
          gzip -dc /tmp/v1000-final.gz > /tmp/v1000-final.html
          echo '1c725b57574a89c1fca6b475038b1d9b9ef96d81b0b8ef7568f6b3d7027e6333  /tmp/v1000-final.html' | sha256sum -c -

      - name: Publish v10.0.0 update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Empire Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- packages/v10.0.0 version.json README.md
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
          else
            git commit -m 'Publish AI Empire Tycoon v10.0.0 company and world expansion'
            git push
          fi
