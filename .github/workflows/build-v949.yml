name: Build and publish AI Empire Tycoon v9.4.9

on:
  pull_request:
    paths:
      - 'build/v9.4.9/**'
      - '.github/workflows/build-v949.yml'
  push:
    branches: [main]
    paths:
      - 'build/v9.4.9/**'
      - '.github/workflows/build-v949.yml'

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v9.4.8 base
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.8/part*.txt > /tmp/v948.b64
          base64 -d /tmp/v948.b64 > /tmp/v948.html.gz
          gzip -dc /tmp/v948.html.gz > /tmp/old
          echo 'f5e06e0e483c98e491595869604b929c741307010fd3426dd7d78f06477a3135  /tmp/old' | sha256sum -c -

      - name: Apply v9.4.9 bounded-thread hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat build/v9.4.9/patch*.txt > /tmp/v949.patch.b64
          base64 -d /tmp/v949.patch.b64 > /tmp/v949.patch.gz
          gzip -dc /tmp/v949.patch.gz > /tmp/v949.patch
          cd /tmp
          patch old < v949.patch
          echo '9ea7e933e7b3e4127895533e35e1ddc764f99b5ffb0e6143cadcf1535712f77a  /tmp/old' | sha256sum -c -

      - name: Verify v9.4.9 queue bounds and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AI Empire Tycoon v9.4.9' /tmp/old
          grep -q 'SOCIAL_MAX_ACTIVE_THREADS_V949=6' /tmp/old
          grep -q 'SOCIAL_SOFT_ACTIVE_THREADS_V949=4' /tmp/old
          grep -q 'shouldAutonomousPostThreadV949' /tmp/old
          grep -q 'pruneFinishedAndOverflowThreadsV949' /tmp/old
          grep -q 'new debates pause automatically when the thread pool is full' /tmp/old
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/old').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('No script block found')
          Path('/tmp/v949.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v949.js

      - name: Package v9.4.9 and update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/v9.4.9
          mkdir -p packages/v9.4.9
          gzip -n -9 -c /tmp/old > /tmp/v949.html.gz
          base64 -w0 /tmp/v949.html.gz > /tmp/v949.b64
          split -b 10000 -d -a 2 --additional-suffix=.txt /tmp/v949.b64 packages/v9.4.9/part
          python3 - <<'PY'
          from pathlib import Path
          import json
          parts=sorted(Path('packages/v9.4.9').glob('part*.txt'))
          base='https://raw.githubusercontent.com/melissakant7-hash/ai-empire-tycoon-updates/main/'
          sha='9ea7e933e7b3e4127895533e35e1ddc764f99b5ffb0e6143cadcf1535712f77a'
          manifest={
            'latestVersion':'9.4.9','required':False,'autoUpdate':True,
            'message':'v9.4.9 fixes endlessly growing Local AI thread queues by capping active conversations, only threading discussion-worthy autonomous posts, trimming old backlog, and draining replies faster when the pool fills.',
            'gameUrl':'','gameParts':[base+str(p).replace('\\','/') for p in parts],
            'gameSha256':sha,'sha256':sha,'encoding':'gzip-base64','patches':[],
            'launcherUrl':'','launcherSha256':'','downloadUrl':'https://github.com/melissakant7-hash/ai-empire-tycoon-updates'
          }
          Path('version.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          readme=readme.replace('- Game: **v9.4.8**','- Game: **v9.4.9**',1)
          if '## v9.4.9' not in readme:
            insert='''## v9.4.9\n\nBounded Local-AI thread scheduler hotfix. v9.4.8 could create 2–4 queued replies for every new autonomous root post while only consuming roughly one reply every other Social Media slot, so the queue could grow indefinitely. v9.4.9 only turns discussion-worthy autonomous posts into debates, caps the active conversation pool, trims legacy v9.4.8 backlog on migration, and gives replies more scheduler slots whenever several conversations are active. Player-company posts and announcements remain prioritized for real replies.\n\nThe v9.4.9 build is verified against SHA-256 `9ea7e933e7b3e4127895533e35e1ddc764f99b5ffb0e6143cadcf1535712f77a`.\n\n'''
            readme=readme.replace('## v9.4.8\n',insert+'## v9.4.8\n',1)
          Path('README.md').write_text(readme,encoding='utf-8')
          print('Generated',len(parts),'parts')
          PY

      - name: Reconstruct published package one final time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.9/part*.txt > /tmp/v949-final.b64
          base64 -d /tmp/v949-final.b64 > /tmp/v949-final.gz
          gzip -dc /tmp/v949-final.gz > /tmp/v949-final.html
          echo '9ea7e933e7b3e4127895533e35e1ddc764f99b5ffb0e6143cadcf1535712f77a  /tmp/v949-final.html' | sha256sum -c -

      - name: Publish v9.4.9 update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Empire Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- packages/v9.4.9 version.json README.md
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
          else
            git commit -m 'Publish AI Empire Tycoon v9.4.9 bounded Local AI threads'
            git push
          fi
