name: Build and publish AI Empire Tycoon v9.4.7

on:
  pull_request:
    paths:
      - 'build/v9.4.7/**'
      - '.github/workflows/build-v947.yml'
  push:
    branches: [main]
    paths:
      - 'build/v9.4.7/**'
      - '.github/workflows/build-v947.yml'

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v9.4.6 base
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.6/part*.txt > /tmp/v946.b64
          base64 -d /tmp/v946.b64 > /tmp/v946.html.gz
          gzip -dc /tmp/v946.html.gz > /tmp/old
          echo 'de832eab0e401e5570832b2a7fd8e2b4954f409938271027b4c4ba2961301809  /tmp/old' | sha256sum -c -

      - name: Apply v9.4.7 Local AI thread reliability patch
        shell: bash
        run: |
          set -euo pipefail
          cat build/v9.4.7/patch*.txt > /tmp/v947.patch.b64
          base64 -d /tmp/v947.patch.b64 > /tmp/v947.patch.gz
          gzip -dc /tmp/v947.patch.gz > /tmp/v947.patch
          cd /tmp
          patch old < v947.patch
          echo '40c371352964e80f70a8f1a94e92bfd9cd5e9dfd41499f8fd0ed757125a6a42b  /tmp/old' | sha256sum -c -

      - name: Verify v9.4.7 Local AI-only threads and syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AI Empire Tycoon v9.4.7' /tmp/old
          grep -q 'socialAIReplyQueueV947' /tmp/old
          grep -q 'processQueuedPlayerReplyV947' /tmp/old
          grep -q 'AI-ONLY WAITING' /tmp/old
          grep -q 'LOCAL AI replies paced/queued' /tmp/old
          grep -q 'simTagV947' /tmp/old
          grep -q '>SIMULATION<' /tmp/old
          grep -q 'seedSocialFromNews=function' /tmp/old
          grep -q 'leakSecretV94=function' /tmp/old
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/old').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m:
              raise SystemExit('No script block found')
          Path('/tmp/v947.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v947.js

      - name: Package v9.4.7 and update manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf packages/v9.4.7
          mkdir -p packages/v9.4.7
          gzip -n -9 -c /tmp/old > /tmp/v947.html.gz
          base64 -w0 /tmp/v947.html.gz > /tmp/v947.b64
          split -b 10000 -d -a 2 --additional-suffix=.txt /tmp/v947.b64 packages/v9.4.7/part
          python3 - <<'PY'
          from pathlib import Path
          import json
          parts=sorted(Path('packages/v9.4.7').glob('part*.txt'))
          base='https://raw.githubusercontent.com/melissakant7-hash/ai-empire-tycoon-updates/main/'
          sha='40c371352964e80f70a8f1a94e92bfd9cd5e9dfd41499f8fd0ed757125a6a42b'
          manifest={
              'latestVersion':'9.4.7',
              'required':False,
              'autoUpdate':True,
              'message':'v9.4.7 fixes missing company-post replies with a persistent paced Local AI reply queue, preserves AI-only Enabled across model startup failures, and labels every agent post LOCAL AI or SIMULATION by its real source.',
              'gameUrl':'',
              'gameParts':[base+str(p).replace('\\','/') for p in parts],
              'gameSha256':sha,
              'sha256':sha,
              'encoding':'gzip-base64',
              'patches':[],
              'launcherUrl':'',
              'launcherSha256':'',
              'downloadUrl':'https://github.com/melissakant7-hash/ai-empire-tycoon-updates'
          }
          Path('version.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          readme=Path('README.md').read_text(encoding='utf-8')
          readme=readme.replace('- Game: **v9.4.6**','- Game: **v9.4.7**',1)
          if '## v9.4.7' not in readme:
              insert='''## v9.4.7\n\nLocal-AI thread reliability hotfix. Reputation-based company posts now put their expected replies into a persistent save-backed queue instead of attempting a fragile immediate burst. Each queued reply consumes a normal paced social publishing slot, so a target conversation such as 7 replies visibly progresses 0/7 → 1/7 → … → 7/7. Existing v9.4.6 player posts with an unfulfilled reply target are migrated into this queue automatically. Autonomous Local-AI threads also grow through the same paced queue so Hot Debate remains active without instant reply spam.\n\nThe Local AI Enabled choice is now sticky across browser/model initialization problems. If the local LanguageModel is unavailable or still preparing, Social Media enters **AI-ONLY WAITING** and creates no simulated fallback text; queued work resumes automatically when the model becomes ready. Every agent message now exposes its actual provenance with a **LOCAL AI** or **SIMULATION** badge, including historical posts already present in saves. News seeding and secret-project leaks also respect AI-only mode.\n\nThe v9.4.7 build is verified against SHA-256 `40c371352964e80f70a8f1a94e92bfd9cd5e9dfd41499f8fd0ed757125a6a42b`.\n\n'''
              readme=readme.replace('## v9.4.6\n',insert+'## v9.4.6\n',1)
          Path('README.md').write_text(readme,encoding='utf-8')
          print('Generated',len(parts),'parts')
          PY

      - name: Reconstruct published package one final time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cat packages/v9.4.7/part*.txt > /tmp/v947-final.b64
          base64 -d /tmp/v947-final.b64 > /tmp/v947-final.gz
          gzip -dc /tmp/v947-final.gz > /tmp/v947-final.html
          echo '40c371352964e80f70a8f1a94e92bfd9cd5e9dfd41499f8fd0ed757125a6a42b  /tmp/v947-final.html' | sha256sum -c -

      - name: Publish v9.4.7 update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AI Empire Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- packages/v9.4.7 version.json README.md
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
          else
            git commit -m 'Publish AI Empire Tycoon v9.4.7 Local AI thread reliability hotfix'
            git push
          fi
